- name: "{{ task_prefix }}Download Sublime HQ key"
  get_url:
    url: "https://download.sublimetext.com/sublimehq-pub.gpg"
    dest: "/etc/apt/keyrings/sublimehq-pub.asc"
  become: true

- name: "{{ task_prefix }}Create sublime apt source"
  copy:
    dest: /etc/apt/sources.list.d/sublime-text.sources
    content: |
      Types: deb
      URIs: https://download.sublimetext.com/
      Suites: apt/stable/
      Signed-By: /etc/apt/keyrings/sublimehq-pub.asc
  become: true

- name: "{{ task_prefix }}Install sublime text"
  apt:
    state: latest
    pkg:
      - sublime-text
    update_cache: true
  become: true
