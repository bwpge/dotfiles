- ansible.builtin.import_tasks: "{{ playbook_dir }}/shared/include_os.yml"

- name: "Install oh-my-posh"
  shell: |
    curl -fsSL https://ohmyposh.dev/install.sh | bash -s -- -d "$HOME/.local/bin"
  args:
    creates: "{{ ansible_facts['env'].HOME }}/.local/bin/oh-my-posh"
  when: ansible_facts['system'] == 'Linux'

- name: "Ensure omp config directory exists"
  ansible.builtin.file:
    path: "{{ ansible_facts['env'].HOME }}/.config/oh-my-posh"
    state: directory
    mode: '0755'

- name: "Install omp config"
  ansible.builtin.copy:
    src: zcmder.omp.json
    dest: "{{ ansible_facts['env'].HOME }}/.config/oh-my-posh/zcmder.omp.json"
    mode: '0644'

- name: "Update prompt"
  blockinfile:
    path: "{{ zsh_config.path }}"
    block: |
      autoload -Uz add-zsh-hook
      __newline_precmd() {
          $funcstack[1]() {
              echo
          }
      }
      add-zsh-hook precmd __newline_precmd

      VIRTUAL_ENV_DISABLE_PROMPT=1

      eval "$(oh-my-posh init zsh --config "$HOME/.config/oh-my-posh/zcmder.omp.json")"
    append_newline: true
    prepend_newline: true
    marker: "# {mark} dotfile:omp"
    marker_begin: '>>>'
    marker_end: '<<<'
  when: zsh_config.exists
