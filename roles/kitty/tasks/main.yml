- name: "Ensure config directory exists"
  file:
    path: "{{ ansible_env.HOME }}/.config/kitty"
    state: directory

- name: "Install config"
  copy:
    src: kitty.conf
    dest: "{{ ansible_env.HOME }}/.config/kitty/kitty.conf"
    mode: 0644

- name: "Install right-click kitten"
  copy:
    src: right_click_copy_paste.py
    dest: "{{ ansible_env.HOME }}/.config/kitty/right_click_copy_paste.py"
    mode: 0644

- name: Import OS family tasks
  include_tasks: "{{ item }}"
  with_fileglob: "{{ os_family_lower }}.yml"
  vars:
    task_prefix: "{{ os_family_lower }} | "

- name: Import OS ID tasks
  include_tasks: "{{ item }}"
  with_fileglob: "{{ os_id }}.yml"
  vars:
    task_prefix: "{{ os_id }} | "
  when: os_family_lower != os_id

- name: "Add kitty ssh fix"
  blockinfile:
    path: "{{ shell_item.path }}"
    block: |
      # fixes terminal issues with ssh
      [[ "$TERM" == "xterm-kitty" ]] && alias ssh="TERM=xterm-256color ssh"
    append_newline: true
    prepend_newline: true
    marker: "# {mark} dotfile:kitty"
    marker_begin: '>>>'
    marker_end: '<<<'
  when: shell_item.exists
  loop: "{{ shell_configs }}"
  loop_control:
    loop_var: shell_item
