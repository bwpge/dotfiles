- name: "{{ task_prefix }}Configure prompt"
  blockinfile:
    path: "{{ zsh_config.path }}"
    block: |
      {% raw %}configure_prompt() {
          prompt_symbol=㉿
          # Skull emoji for root terminal
          #[ "$EUID" -eq 0 ] && prompt_symbol=💀
          case "$PROMPT_ALTERNATIVE" in
              twoline)
                  PROMPT=$'%F{%(#.blue.green)}${debian_chroot:+($debian_chroot) }${VIRTUAL_ENV:+($(basename $VIRTUAL_ENV)) }%F{green}%(6~.%-1~/…/%4~.%5~)\n%F{black}%(#.#.λ)%F{reset} '
                  # Right-side prompt with exit codes and background processes
                  #RPROMPT=$'%(?.. %? %F{red}%B⨯%b%F{reset})%(1j. %j %F{yellow}%B⚙%b%F{reset}.)'
                  ;;
              oneline)
                  PROMPT=$'${debian_chroot:+($debian_chroot)}${VIRTUAL_ENV:+($(basename $VIRTUAL_ENV))}%B%F{%(#.red.blue)}%n@%m%b%F{reset}:%B%F{%(#.blue.green)}%~%b%F{reset}%(#.#.$) '
                  RPROMPT=
                  ;;
              backtrack)
                  PROMPT=$'${debian_chroot:+($debian_chroot)}${VIRTUAL_ENV:+($(basename $VIRTUAL_ENV))}%B%F{red}%n@%m%b%F{reset}:%B%F{blue}%~%b%F{reset}%(#.#.$) '
                  RPROMPT=
                  ;;
          esac
          unset prompt_symbol
      }

      configure_prompt
      {% endraw %}
    append_newline: true
    prepend_newline: true
    marker: "# {mark} dotfile:prompt"
    marker_begin: '>>>'
    marker_end: '<<<'

- name: "{{ task_prefix }}Read zsh config"
  shell: "cat {{ zsh_config.path }}"
  register: oldzsh
  changed_when: false

- name: "{{ task_prefix }}Fix zsh suggest highlight"
  shell: >
    sed -i 's/^\([[:space:]]\+\)\(ZSH_AUTOSUGGEST_HIGHLIGHT_STYLE\)/\1# \2/g'
    {{ zsh_config.path }} && cat {{ zsh_config.path }}
  register: newzsh
  become: true
  changed_when: oldzsh.stdout != newzsh.stdout
