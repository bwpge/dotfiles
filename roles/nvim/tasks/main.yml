- name: Clone and update neovim config
  git:
    repo: 'https://github.com/bwpge/nvim-config.git'
    dest: "{{ ansible_facts['env'].HOME }}/.config/nvim"
    version: main
    update: true
    force: true
  notify: Install neovim plugins

- ansible.builtin.import_tasks: "{{ playbook_dir }}/shared/include_os.yml"
