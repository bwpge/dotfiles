- name: Clone and update neovim config
  git:
    repo: 'https://github.com/bwpge/nvim-config.git'
    dest: "{{ ansible_env.HOME }}/.config/nvim"
    version: main
    update: true
    force: true
  notify: Install neovim plugins

- name: Import OS family tasks
  include_tasks: "{{ item }}"
  with_fileglob: "{{ os_family_lower }}.yml"
  vars:
    task_prefix: "{{ os_family_lower }} | "

- name: Import OS ID tasks
  include_tasks: "{{ item }}"
  with_fileglob: "{{ os_id }}.yml"
  vars:
    task_prefix: "{{ os_id }} | "
  when: os_family_lower != os_id
