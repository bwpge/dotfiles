- ansible.builtin.import_tasks: "{{ playbook_dir }}/shared/include_os.yml"

- name: Install tmux config
  copy:
    src: ".tmux.conf"
    dest: "{{ ansible_facts['env'].HOME }}/.tmux.conf"
    mode: 0644

- name: "Add tmux shell block"
  blockinfile:
    path: "{{ shell_item.path }}"
    block: |
      function tvpn {
          vpnfile="$1"
          if [ -z "$vpnfile" ] && [ -d /mnt/shared ]; then
              vpnfile="$(find /mnt/shared -type f -name '*.ovpn' | fzf --height='~100%')"
          fi
          if [ -f "$vpnfile" ]; then
              tmux new -s vpn -A "sudo openvpn $vpnfile"
          else
              echo "error: a VPN file is required" >&2
          fi
      }

      alias tclear='cur=$(tmux display -p "#I"); for w in $(tmux lsw -F "#I"); do tmux selectw -t $w; done; tmux selectw -t $cur'
    append_newline: true
    prepend_newline: true
    marker: "# {mark} dotfile:tmux"
    marker_begin: '>>>'
    marker_end: '<<<'
  when: shell_item.exists
  loop: "{{ shell_configs }}"
  loop_control:
    loop_var: shell_item
