set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g escape-time 10
set -g set-clipboard on
set -g history-limit 50000
set -g repeat-time 1000
set -g monitor-activity on
set -g mouse on
set -s set-clipboard external
set -as terminal-features ',xterm-*:clipboard'

# use 1-based index
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# prefix
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# better mouse behavior
unbind -T copy-mode-vi MouseDragEnd1Pane
unbind -T copy-mode-vi MouseDown3Pane
unbind -n MouseDown3Pane
bind -n MouseDown3Pane paste-buffer
bind -T copy-mode-vi MouseDown1Pane send-keys -X clear-selection
bind -T copy-mode-vi MouseDown3Pane send-keys -X copy-selection-and-cancel
bind -T copy-mode WheelUpPane send -N3 -X scroll-up
bind -T copy-mode WheelDownPane send -N3 -X scroll-down

# use vim keys
setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# copy mode
unbind -T copy-mode-vi v
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection
bind -T copy-mode-vi C-Home send-keys -X history-top
bind -T copy-mode-vi C-End send-keys -X history-bottom
bind -T copy-mode-vi C-Up send-keys -X halfpage-up
bind -T copy-mode-vi C-Down send-keys -X halfpage-down

# setting toggles
bind -n M-S set -gF mouse "#{?mouse,off,on}" \; display "mouse: #{?mouse,on,off}"
bind m set -gF mouse "#{?mouse,off,on}" \; display "mouse: #{?mouse,on,off}"
bind a setw monitor-activity \; run-shell "onoff=\"\$(tmux showw monitor-activity)\"; tmux display \"\$onoff\""
bind C-k setw synchronize-panes

# window management
bind , command-prompt { rename-window "%%" }
bind c new-window -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind & kill-window
bind x kill-pane
bind X confirm-before -p "kill current session? (y/n)" kill-session
bind -r Tab next-window
bind -r BTab previous-window

# no prefix keys
bind -n M-S-Up select-pane -U
bind -n M-S-Down select-pane -D
bind -n M-S-Left select-pane -L
bind -n M-S-Right select-pane -R
bind -n M-X kill-pane
bind -n M-| split-window -h -c "#{pane_current_path}"
bind -n M-_ split-window -v -c "#{pane_current_path}"

# select pane to join (like opposite of !)
bind-key @ choose-window 'join-pane -h -s "%%"'

# save pane to file
bind C-p command-prompt -p 'save pane to file:' \
    -I "#{pane_current_path}/#{session_name}-#{window_name}-#{pane_index}_%Y%m%d_%H%M%S.txt" \
    'capture-pane -S - ; save-buffer %1 ; delete-buffer'

# clear activity flags by quickly visiting each window
bind-key C-l run-shell 'cur=`tmux display-message -p "##I"`; \
    for w in `tmux lsw -F "##I"`; do tmux select-window -t "$w"; done; \
    tmux select-window -t "$cur"'

# icons
PILL_OPEN="#([ -z "$TMUX_NONF" ] && printf '\ue0B6' || printf '\u2588')"
PILL_CLOSE="#([ -z "$TMUX_NONF" ] && printf '\ue0B4' || printf '\u2588')"
ACTIVITY_ICON="#([ -z "$TMUX_NONF" ] && printf '\uf444' || printf '\u2022')"
ZOOM_ICON="#(printf '\u2191')"

# styling
setw -g automatic-rename off
set -g status-position top
set -g status-left-length 100
set -g status-right-length 100
set -g status-justify right

set -g status-style fg=black,bg=default
set -g message-style fg=default,bg=default
set -g window-status-activity-style fg=black,bg=default
set -g window-status-current-style fg=green
set -g pane-border-style fg=black
set -g pane-active-border-style fg=white
set -g mode-style fg=yellow,reverse,bold

set -g status-left "#([ -d /proc/sys/net/ipv4/conf/tun0 ] && ip -4 -br a | grep tun | cut -d/ -f1 | awk '{printf "\""%%s:%%s "\"", $1, $3}')"
set -g status-right " ${PILL_OPEN}#[fg=black,bold,reverse]#S#{?TARGET,:#{TARGET},}#[default]${PILL_CLOSE}"
set -g window-status-format " #{?window_activity_flag,#[underscore],}#I:#W#{?window_activity_flag,#[nounderscore] ${ACTIVITY_ICON},} "
set -g window-status-current-format "#{?pane_synchronized,#[fg=magenta],}#{?client_prefix,#[fg=yellow],}${PILL_OPEN}#[reverse,bold]#I:#W#{?window_zoomed_flag, ${ZOOM_ICON},}#[noreverse,nobold]${PILL_CLOSE}"
set -g window-status-separator ""

# reload config
bind r source-file ~/.tmux.conf \; display "config reloaded"
