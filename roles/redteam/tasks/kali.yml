  register: juicypotato_info
  changed_when: false
  tags:
    - carepackage

- name: "{{ task_prefix }}Juicy-Potato-x86 | Download"
  get_url:
    url: "https://github.com/ivanitlearning/Juicy-Potato-x86/releases/download/{{ juicypotato_info.json.tag_name }}/Juicy.Potato.x86.exe"
    dest: /opt/potato/JuicyPotato-x86.exe
