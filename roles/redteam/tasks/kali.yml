- name: "{{ task_prefix}}Add red team shell block"
  blockinfile:
    path: "{{ shell_item.path }}"
    block: |
      export ROCKYOU='/usr/share/wordlists/rockyou.txt'

      function attack {
          parent="$(dirname "$1")"
          name="$(basename "$1" | tr '[:upper:]' '[:lower:]' | sed 's/[^[:alnum:]]/_/g')"
          target="$2"

          if [ -z "$name" ]; then
              echo "error: target name is required"
              return 1
          fi
          if tmux has-session -t "$name" 2>/dev/null; then
              tmux attach-session -t "$name"
              return 0
          fi

          if [ -z "$target" ]; then
              echo "error: target IP is required"
              return 1
          fi

          boxdir="$HOME/boxes/$name"
          if [ "$parent" != "." ]; then
              boxdir="$HOME/boxes/$parent/$name"
          fi

          attacker="$(ip -br addr | grep tun0 | awk '{print $3}' | cut -d'/' -f1)"
          if [ -z "$attacker" ]; then
              attacker="$(hostname -I | awk '{print $1}')"
          fi

          mkdir -p "$boxdir" && \
              tmux new-session -d -c "$boxdir" -s "$name" -e ATTACKER="$attacker" -e TARGET="$target" -e TARGET_NAME="$name" -e BOXDIR="$boxdir" && \
              tmux splitw -t "$name" -v -c "$boxdir" && \
              tmux rename-window -t "$name:1" recon && \
              tmux neww -c "$boxdir" -t "$name:" && \
              tmux neww -c "$boxdir" -t "$name:" && \
              tmux neww -c "$boxdir" -t "$name:" "ping -i 10 $target" && \
              tmux setw -t "$name:4" monitor-activity off && \
              tmux rename-window -t "$name:4" ping && \
              tmux selectw -t "$name:1" && \
              tmux selectp -t "$name:1.1" && \
              tmux attach-session -t "$name"
      }

      function urlencode {
          echo -n "$1" | python3 -c 'import urllib.parse;import sys;print(urllib.parse.quote_plus(sys.stdin.read(),safe="'"$2"'"))'
      }

      function urldecode {
          echo -n "$1" | python3 -c 'import urllib.parse;import sys;print(urllib.parse.unquote_plus(sys.stdin.read()))'
      }

      function myip {
          ip_local="$(hostname -I | awk '{print $1}')"
          ip_tun0="$(ip -br addr | grep tun0 | awk '{print $3}' | cut -d'/' -f1)"
          [ -z "$ip_tun0" ] && echo "$ip_local" || echo "$ip_tun0"
      }

      function clip {
          # check if stdin is terminal
          if [ -t 0 ]; then
              value="$@"
              if [ -z "$value" ]; then
                  echo "error: nothing to copy" >&2
                  return 1
              fi
              echo -n "$@" | sed -Ez '$ s/\n+$//' | xclip -in -selection clipboard
          # use stdin if not a terminal (most likely piped)
          else
              cat - | sed -Ez '$ s/\n+$//' | xclip -in -selection clipboard
          fi
      }

      alias listen='nc -lvnp'
      alias serve='python3 -m http.server'
    append_newline: true
    prepend_newline: true
    marker: "# {mark} dotfile:redteam"
    marker_begin: '>>>'
    marker_end: '<<<'
  when: shell_item.exists
  loop: "{{ shell_configs }}"
  loop_control:
    loop_var: shell_item

- name: "{{task_prefix}}kerbrute | Query latest version"
  uri:
    url: https://api.github.com/repos/ropnop/kerbrute/releases/latest
  register: kerbrute_info
  changed_when: false

- name: "{{ task_prefix }}kerbrute | Download and install"
  get_url:
    url: "https://github.com/ropnop/kerbrute/releases/download/{{ kerbrute_info.json.tag_name }}/kerbrute_linux_amd64"
    dest: "/usr/local/bin/kerbrute"
    mode: 0755
  become: true

- name: "{{task_prefix}}bloodhound-cli | Query latest version"
  uri:
    url: https://api.github.com/repos/SpecterOps/bloodhound-cli/releases/latest
  register: bhcli_info
  changed_when: false

- name: "{{ task_prefix }}bloodhound-cli | Download and install"
  unarchive:
    remote_src: true
    src: "https://github.com/SpecterOps/bloodhound-cli/releases/download/{{ bhcli_info.json.tag_name }}/bloodhound-cli-linux-{{ ansible_facts['machine'] | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}.tar.gz"
    dest: "/usr/local/bin"
    creates: "/usr/bin/local/bloodhound-cli"
    mode: 0755
  become: true

- name: "{{task_prefix}}Clone and update SharpCollection"
  git:
    repo: 'https://github.com/Flangvik/SharpCollection.git'
    dest: "/opt/SharpCollection"
    version: master
    update: true
    force: true
  become: true

- name: "{{task_prefix}}chisel | Query latest version"
  uri:
    url: https://api.github.com/repos/jpillora/chisel/releases/latest
  register: chisel_info
  changed_when: false

- name: Check for chisel binary
  stat:
    path: /usr/local/bin/chisel
  register: chiselbin
  changed_when: false

- name: "{{ task_prefix }}chisel | Download and install linux binary"
  shell: >
    curl -sfL https://github.com/jpillora/chisel/releases/download/{{ chisel_info.json.tag_name }}/chisel_{{ chisel_info.json.tag_name[1:] }}_linux_{{ ansible_facts['machine'] | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}.gz |
    gunzip > /usr/local/bin/chisel &&
    chmod 0755 /usr/local/bin/chisel
  become: true
  when: not chiselbin.stat.exists

- name: "{{ task_prefix }}chisel | Create opt directory"
  file:
    path: /opt/chisel
    state: directory
  become: true

- name: "{{ task_prefix }}chisel | Download windows binary"
  unarchive:
    remote_src: true
    src: "https://github.com/jpillora/chisel/releases/download/{{ chisel_info.json.tag_name }}/chisel_{{ chisel_info.json.tag_name[1:] }}_windows_amd64.zip"
    dest: "/opt/chisel"
    creates: "/opt/chisel/chisel.exe"
  become: true
