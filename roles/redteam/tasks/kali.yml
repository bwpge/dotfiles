- name: "{{ task_prefix }}SweetPotato | Link into /opt/potato"
  file:
    src: /opt/SharpCollection/NetFramework_4.7_Any/SweetPotato.exe
    dest: /opt/potato/SweetPotato.exe
    state: link
    force: true
    follow: false
  become: true
  notify: Rebuild windows carepackage
  tags:
    - carepackage

- name: "{{ task_prefix }}Care package | Create directories"
  file:
    path: "/opt/carepackage/{{ item }}"
    state: directory
  become: true
  loop:
    - windows
    - linux
  tags:
    - carepackage

- name: "{{ task_prefix }}Care package | Link windows tools"
  file:
    src: "{{ item.src }}"
    dest: "/opt/carepackage/windows/{{ item.dest }}"
    state: link
    force: true
    follow: false
  become: true
  loop: "{{ redteam_carepackage_windows }}"
  loop_control:
    label: "{{ item.dest }}"
  notify: Rebuild windows carepackage
  tags:
    - carepackage

- name: "{{ task_prefix }}Care package | Link linux tools"
  file:
    src: "{{ item.src }}"
    dest: "/opt/carepackage/linux/{{ item.dest }}"
    state: link
    force: true
    follow: false
  become: true
  loop: "{{ redteam_carepackage_linux }}"
  loop_control:
    label: "{{ item.dest }}"
  notify: Rebuild linux carepackage
  tags:
    - carepackage

- name: "{{ task_prefix }}Care package | Write tool sources reference"
  copy:
    src: carepackage-sources.md
    dest: /opt/carepackage/SOURCES.md
    mode: 0644
  become: true
  tags:
    - carepackage
