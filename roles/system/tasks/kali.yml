- name: "{{ task_prefix}}Install build tools"
  become: true
  apt:
    state: latest
    pkg:
      - build-essential
      - cmake
      - gettext
      - git
      - mingw-w64
      - ninja-build

- name: "{{ task_prefix}}Install extra packages"
  become: true
  apt:
    state: latest
    pkg:
      - autorecon
      - awscli
      - docker-compose
      - docker.io
      - feroxbuster
      - kali-wallpapers-all
      - python3-wsgidav
      - seclists

- name: "{{ task_prefix}}Install dotnet packages"
  become: true
  apt:
    state: latest
    pkg:
      - dotnet-runtime-deps-6.0
      - dotnet-sdk-6.0
      - mono-devel
      - mono-runtime

- name: "{{ task_prefix}}Check for ssh key"
  stat:
    path: ~/.ssh/id_ed25519
  register: sshkey_check

- name: "{{ task_prefix}}Create ssh key"
  shell: |
    ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N ""
  args:
    executable: /bin/sh
  when: not sshkey_check.stat.exists

- name: "{{ task_prefix}}Decompress rockyou.txt"
  command: gunzip -k /usr/share/wordlists/rockyou.txt.gz
  args:
    creates: /usr/share/wordlists/rockyou.txt
  become: true
