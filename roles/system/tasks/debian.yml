- name: "{{ task_prefix}}Update cache"
  become: true
  apt:
    update_cache: true

- name: "{{ task_prefix}}Install packages"
  become: true
  apt:
    state: latest
    pkg: "{{ system_packages_debian }}"

- name: "{{ task_prefix }}Install X11 packages"
  become: true
  apt:
    state: latest
    pkg: "{{ system_packages_x11 }}"
  when: session_x11

- name: "Install Wayland packages"
  become: true
  apt:
    state: latest
    pkg: "{{ system_packages_wayland }}"
  when: session_wayland
