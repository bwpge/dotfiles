- name: Install gpg
  become: true
  apt:
    state: latest
    pkg:
      - gpg
  when: os_family_lower == 'debian'

- name: Ensure gpg directory exists
  file:
    path: "{{ ansible_facts['env'].HOME }}/.gnupg"
    state: directory
    mode: 0700

- name: Check for gpg-agent config
  stat:
    path: "{{ ansible_facts['env'].HOME }}/.gnupg/gpg-agent.conf"
  register: gpgconf
  changed_when: false

- name: Install gpg config
  copy:
    src: "gpg-agent.conf"
    dest: "{{ ansible_facts['env'].HOME }}/.gnupg/gpg-agent.conf"
    mode: 0644
  when: not gpgconf.stat.exists

- name: Import OS family tasks
  include_tasks: "{{ item }}"
  with_fileglob: "{{ os_family_lower }}.yml"
  vars:
    task_prefix: "{{ os_family_lower }} | "

- name: Import OS ID tasks
  include_tasks: "{{ item }}"
  with_fileglob: "{{ os_id }}.yml"
  vars:
    task_prefix: "{{ os_id }} | "
  when: os_family_lower != os_id
