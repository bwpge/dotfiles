- name: System configuration
  hosts: all

  pre_tasks:
    - name: Import pre-tasks
      include_tasks:
        file: "{{ item }}"
        apply:
          tags:
            - always
      with_fileglob: "pre_tasks/*.yml"
      tags:
        - always

  roles:
    - role: system
      tags:
        - system
        - common
    - role: grub
      tags:
        - grub
        - common
    - role: fonts
      tags:
        - fonts
        - common
    - role: git
      tags:
        - git
        - dev
    - role: go
      tags:
        - go
        - dev
    - role: rust
      tags:
        - rust
        - dev
    - role: kitty
      tags:
        - kitty
    - role: nvim
      tags:
        - nvim
        - utils
    - role: tmux
      tags:
        - tmux
        - utils
    - role: vim
      tags:
        - vim
        - utils
    - role: redteam
      tags:
        - redteam
    - role: wayland
      tags:
        - wayland
        - common
    - role: xfce
      tags:
        - xfce
    - role: zsh
      tags:
        - zsh

    # run only if specified in tags
    - role: 1password
      tags:
        - 1password
        - never
    - role: bash
      tags:
        - bash
        - never
    - role: qterm
      tags:
        - qterm
        - never
