- name: System configuration
  hosts: all

  pre_tasks:
    - name: Import pre-tasks
      include_tasks:
        file: "{{ item }}"
        apply:
          tags:
            - always
      with_fileglob: "pre_tasks/*.yml"
      tags:
        - always

  roles:
    - role: system
      tags:
        - system
        - common
    - role: grub
      tags:
        - grub
        - common
    - role: fonts
      tags:
        - fonts
        - common
    - role: git
      tags:
        - git
        - dev
    - role: go
      tags:
        - go
        - dev
    - role: rust
      tags:
        - rust
        - dev
    - role: kitty
      tags:
        - kitty
        - utils
        - kali
    - role: nvim
      tags:
        - nvim
        - utils
    - role: vim
      tags:
        - vim
        - utils
    - role: xfce
      tags:
        - xfce
    - role: zsh
      tags:
        - zsh
