---
- name: Detect OS ID
  shell: |
    if command lsb_release > /dev/null 2>&1; then
      lsb_release -is
    elif command sw_vers > /dev/null 2>&1; then
      sw_vers -productName
    fi
  args:
    executable: /bin/sh
  register: _os_id
  changed_when: false

- name: Set OS facts
  set_fact:
    os_id: "{{ _os_id.stdout | lower | default(None) }}"
    os_family_lower: "{{ ansible_os_family | lower | default(None) }}"
  changed_when: false

- name: Ensure facts are valid
  assert:
    that:
      - "os_id is not undefined"
      - "os_id != None"
      - "os_family_lower is not undefined"
      - "os_family_lower != None"
  changed_when: false
